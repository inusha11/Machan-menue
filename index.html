<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Noto+Sans+Sinhala:wght@600;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one dark card like the printed menu. Sticky category rail on top, ruled rows below, prices in fixed right-hand columns. */
:root {
  --bg: #14110d;
  --surface: #1d1912;
  --line: #3a3226;
  --fg: #f1e9d8;
  --muted: #a79c86;
  --gold: #e9a820;
  --gold-ink: #1a1405;
  --display: 'Oswald', 'Arial Narrow', sans-serif;
  --body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sinhala: 'Noto Sans Sinhala', 'Iskoola Pota', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 3rem;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap { max-width: 44rem; margin: 0 auto; }

header { padding-block: 1.5rem 1rem; display: flex; align-items: flex-end; gap: 0.75rem; flex-wrap: wrap; }
.brand { font-family: var(--sinhala); font-weight: 700; font-size: 3.25rem; line-height: 1.2; color: var(--gold); margin: 0; }
.word { font-family: var(--display); font-weight: 500; font-size: 1.75rem; letter-spacing: 0.2em; padding-bottom: 0.6rem; }
.note { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 0.875rem; }

.rail {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 0.625rem;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.chips { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.125rem; }
.chips::-webkit-scrollbar { display: none; }
.chips a {
  flex: none;
  color: var(--fg);
  text-decoration: none;
  font-family: var(--display);
  font-weight: 500;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.4rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.chips a:hover { border-color: var(--gold); }
.chips a:focus-visible, #q:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.chips a[aria-current="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.search { margin-block: 1rem 0.25rem; }
#q {
  width: 100%;
  font: inherit;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
}
#q::placeholder { color: var(--muted); }

section { margin-top: 2rem; }
section h2 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.375rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 0.25rem;
  padding: 0.35rem 0.75rem;
  background: var(--gold);
  color: var(--gold-ink);
  display: inline-block;
}
.sub { color: var(--muted); font-size: 0.8125rem; margin: 0.35rem 0 0; }
.group { margin-top: 0.75rem; }
.glabel { font-family: var(--display); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); font-size: 0.9rem; margin: 1rem 0 0; }
.colhead, .row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--n), var(--w, 4.75rem)); column-gap: 0.5rem; align-items: baseline; }
.dense { --w: 3.35rem; column-gap: 0.3rem; }
.dense .row, .dense.colhead { column-gap: 0.3rem; }
.dense .price { font-size: 0.8125rem; }
.dense .colhead { font-size: 0.625rem; letter-spacing: 0.03em; }
.colhead { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: right; line-height: 1.2; padding-block: 0.5rem 0.25rem; }
.row { padding-block: 0.65rem; border-bottom: 1px solid var(--line); }
.name { min-width: 0; overflow-wrap: anywhere; }
.name small { display: block; color: var(--muted); font-size: 0.8125rem; }
.price { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.row[hidden], section[hidden], .group[hidden] { display: none !important; }
.empty { color: var(--muted); margin-top: 2rem; }
footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.875rem; border-top: 1px solid var(--line); padding-top: 1rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

function fmt(n) { return n.toLocaleString("en-US"); }
function colLabel(s) { var p = s.split("|"); return p.length > 1 ? p[0] + "<br>" + p[1] : s; }

var menu = document.getElementById("menu");
var chips = document.getElementById("chips");
var html = "", chipHtml = "";
SECTIONS.forEach(function (s) {
  chipHtml += '<a href="#' + s.id + '" data-id="' + s.id + '">' + s.title + "</a>";
  html += '<section id="' + s.id + '"><h2>' + s.title + "</h2>";
  s.groups.forEach(function (g) {
    var n = g.cols.length;
    var hasHead = g.cols.some(function (c) { return c; });
    html += '<div class="group' + (n > 3 ? ' dense' : '') + '" style="--n:' + n + '">';
    if (g.label) html += '<p class="glabel">' + g.label + "</p>";
    if (hasHead) {
      html += '<div class="colhead" aria-hidden="true"><span></span>';
      g.cols.forEach(function (c, i) { html += "<span" + (i === 0 ? "" : "") + ">" + colLabel(c) + "</span>"; });
      html += "</div>";
    }
    g.items.forEach(function (it) {
      html += '<div class="row" data-s="' + (it[0] + " " + it[1] + " " + (g.label || "")).toLowerCase() + '"><div class="name">' + it[0] + (it[1] ? "<small>" + it[1] + "</small>" : "") + "</div>";
      var offset = n - it[2].length;
      for (var k = 0; k < offset; k++) html += "<div></div>";
      it[2].forEach(function (p) { html += '<div class="price">' + fmt(p) + "</div>"; });
      html += "</div>";
    });
    html += "</div>";
  });
  html += "</section>";
});
menu.innerHTML = html;
chips.innerHTML = chipHtml;

/* Colhead: first label sits over the first price column; fix grid placement */
Array.prototype.forEach.call(document.querySelectorAll(".colhead"), function (h) {
  var spans = h.querySelectorAll("span");
  for (var i = 1; i < spans.length; i++) spans[i].style.gridColumn = String(i + 1);
  spans[0].style.gridColumn = "1";
});

/* Search */
var q = document.getElementById("q");
var empty = document.getElementById("empty");
q.addEventListener("input", function () {
  var t = q.value.trim().toLowerCase();
  var any = false;
  Array.prototype.forEach.call(menu.querySelectorAll("section"), function (sec) {
    var secTitle = sec.querySelector("h2").textContent.toLowerCase();
    var secShown = false;
    Array.prototype.forEach.call(sec.querySelectorAll(".group"), function (grp) {
      var shown = false;
      Array.prototype.forEach.call(grp.querySelectorAll(".row"), function (row) {
        var ok = !t || row.getAttribute("data-s").indexOf(t) > -1 || secTitle.indexOf(t) > -1;
        row.hidden = !ok;
        if (ok) shown = true;
      });
      grp.hidden = !shown;
      if (shown) secShown = true;
    });
    sec.hidden = !secShown;
    if (secShown) any = true;
  });
  empty.hidden = any;
});

/* Highlight the category in view */
if ("IntersectionObserver" in window) {
  var links = {};
  Array.prototype.forEach.call(chips.querySelectorAll("a"), function (a) { links[a.getAttribute("data-id")] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        Object.keys(links).forEach(function (k) { links[k].removeAttribute("aria-current"); });
        var a = links[e.target.id];
        a.setAttribute("aria-current", "true");
        var box = chips, left = a.offsetLeft - 16;
        try { box.scrollTo({ left: left, behavior: "smooth" }); } catch (err) { box.scrollLeft = left; }
      }
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  Array.prototype.forEach.call(menu.querySelectorAll("section"), function (s) { io.observe(s); });
}
